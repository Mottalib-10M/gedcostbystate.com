name: GED and HiSET costs, weekly price check and deployment

# GED Testing Service publishes one policy page per state (ged.com/policies/<state>/), with the price per
# subject at a test center, online, and the retake fee. Every Monday: price check (scripts/update-data.mjs),
# engine and content tests, build, GitHub Pages; data/facts/releve-ged.json and src/data/hse.json are
# recommitted when a price has changed. The script changes a value only when it finds the page's sentence
# as printed; if more than 5 pages fail it writes nothing and the site keeps last week's data. If a test
# fails, nothing is published. HiSET pages (hiset.org) are read by hand: see CONTRIBUTING-DONNEES.md.
on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Price check (ged.com state pages)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/update-data.mjs
      - name: Tests
        run: npx vitest run
      - name: Build (with snippet check)
        run: npm run build
      - name: Recommit data if it changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "releve-prix-ged"
          git config user.email "releve-prix-ged@users.noreply.github.com"
          git add data/facts/releve-ged.json src/data/hse.json
          if ! git diff --cached --quiet; then
            git commit -m "Prix GED : relevé du $(date -u +%F)" && git push || echo "push refused, kept for next run"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (IndexNow script)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh
